            background: #2b6cb0;
            color: white;

            transform: translateY(-3px);

            color: #92400e;
        }

            background: #d69e2e;
            color: white;
            border-color: #d69e2e;
        }

        .footer {
            margin-top: 30px;
            color: #a0aec0;
            font-size: 14px;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }
